[pytest]
# Pytest configuration for MIL-radiomics

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 6.0

# Additional options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail on unknown marks
    --strict-markers
    # Warnings
    --tb=short
    # Coverage options (when pytest-cov is installed)
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc
    # Ignore specific directories
    --ignore=src/
    --ignore=.git/

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU
    requires_data: marks tests that require actual data files

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Capture settings
# Show print statements during test execution
# capture = no
